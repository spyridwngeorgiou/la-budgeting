name: CI

on:
  push:
    branches: [main]
    paths:
      - "backoffice/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backoffice/**"
      - ".github/workflows/ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backoffice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backoffice/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  # Applies every migration to a fresh local Supabase (Docker is available on
  # GitHub runners) and runs the pgTAP suite in supabase/tests -- the RLS and
  # org-isolation guarantees partners depend on.
  db:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backoffice
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: "latest" asks the GitHub API each run and fails when that
          # is rate-limited. Bump deliberately.
          version: 2.120.0
      - run: supabase db start
      # Failing assertions are also raised as annotations so they show on
      # the run summary without opening the full log.
      - name: supabase test db
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee pgtap.log || {
            grep -E "^(not ok|#|[^ ]+\.sql \.\.)|Failed|ERROR|psql:" pgtap.log \
              | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
