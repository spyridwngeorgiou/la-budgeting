name: Keep Supabase project awake

on:
  schedule:
    - cron: "0 6 */3 * *" # every 3 days -- free-tier projects pause after 7 idle days
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/health
        run: curl -fsS "${{ secrets.APP_URL }}/api/health"
